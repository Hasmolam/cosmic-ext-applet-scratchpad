name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libexpat1-dev libfontconfig-dev libfreetype-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: strip target/release/cosmic-ext-applet-scratchpad

      - name: Package release artifacts
        run: |
          mkdir -p artifacts release-pkg
          cp target/release/cosmic-ext-applet-scratchpad release-pkg/cosmic-ext-applet-scratchpad
          cp install.sh uninstall.sh README.md release-pkg/
          cp -r data release-pkg/
          tar -czvf "artifacts/cosmic-ext-applet-scratchpad-${{ matrix.arch }}-linux.tar.gz" -C release-pkg .
          cp target/release/cosmic-ext-applet-scratchpad "artifacts/cosmic-ext-applet-scratchpad-${{ matrix.arch }}-linux"
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp target/release/cosmic-ext-applet-scratchpad artifacts/cosmic-ext-applet-scratchpad
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Copy installer scripts and generate checksums
        run: |
          cp install.sh uninstall.sh dist/
          (cd dist && sha256sum cosmic-ext-applet-scratchpad* install.sh uninstall.sh > SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/cosmic-ext-applet-scratchpad*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
