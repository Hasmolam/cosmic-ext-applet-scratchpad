name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libexpat1-dev libfontconfig-dev libfreetype-dev libxkbcommon-dev libwayland-dev pkg-config

      - name: Build release binary
        run: cargo build --release

      - name: Strip binary
        run: |
          strip target/release/cosmic-ext-applet-scratchpad

      - name: Package Release
        run: |
          mkdir -p release-pkg
          cp target/release/cosmic-ext-applet-scratchpad release-pkg/
          cp install.sh release-pkg/
          cp uninstall.sh release-pkg/
          cp README.md release-pkg/
          cp -r data release-pkg/
          tar -czvf cosmic-ext-applet-scratchpad-x86_64-linux.tar.gz -C release-pkg .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/cosmic-ext-applet-scratchpad
            cosmic-ext-applet-scratchpad-x86_64-linux.tar.gz
            install.sh
            uninstall.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
